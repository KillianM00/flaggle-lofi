name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-firefox@v1
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
      - name: Provide a virtual audio output for Web Audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_output
          pactl set-default-sink ci_output
      - run: node tools/test-all.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/
