<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe4" />
      <stop offset="1" stop-color="#e7d8c4" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#paper)" />
  <rect width="256" height="256" rx="56" filter="url(#grain)" opacity="0.12" />

  <!-- steam -->
  <g stroke="#a2907f" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M104 66c-8-10 8-18 0-28" />
    <path d="M132 60c-8-10 8-18 0-28" />
  </g>

  <!-- saucer -->
  <ellipse cx="128" cy="196" rx="74" ry="14" fill="#d8c3a8" />

  <!-- cup -->
  <path d="M62 104h116v40a52 52 0 0 1-52 52h-12a52 52 0 0 1-52-52z" fill="#cd8a79" />
  <path d="M62 104h116v14H62z" fill="#b8776a" />
  <path d="M178 116h14a24 24 0 0 1 0 48h-8" fill="none" stroke="#cd8a79" stroke-width="14" stroke-linecap="round" />

  <!-- flag planted in the coffee -->
  <rect x="122" y="52" width="7" height="96" rx="3.5" fill="#5c4a3f" />
  <path d="M129 58h62l-14 20 14 20h-62z" fill="#86a583" />
  <circle cx="152" cy="78" r="8" fill="#f7efe4" />
</svg>
